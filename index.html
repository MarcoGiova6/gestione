async function start(u){
  S.uid=u.uid;S.email=u.email||"";
  try{const r=doc(fdb,"users/"+S.uid);const s=await getDoc(r);
    if(!s.exists()){const n=S.email.split("@")[0];await setDoc(r,{name:n.charAt(0).toUpperCase()+n.slice(1)})}}catch(e){}
  subs.users=D.col("users").onSnapshot(q=>{q.docs.forEach(d=>S.names[d.id]=(d.data()||{}).name);render()},fail);
  subs.cfg=D.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.loaded=true;render()},fail);
  subs.admin=D.doc("meta/admin").onSnapshot(s=>{S.adminUid=s.exists?(s.data().uid||null):null;S.adminLoaded=true;render()},fail);
  subs.tasks=D.col("tasks").onSnapshot(q=>{S.tasks=q.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  subs.reports=D.col("reports").onSnapshot(q=>{S.reports=q.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  subs.days=D.col("days").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.daysAll=m;render()},fail);
  subs.weeks=D.col("weeks").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.weeksAll=m;render()},fail);
  subs.bud=D.col("budget").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.budAll=m;S.budErr=false;render()},()=>{S.budErr=true;render()});

}

function waText(x,d,acts){
  const c=eff(),lab=parse(x).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  const L=["*Chiusura, "+lab+"*"];
  const cl=(items,name)=>{const miss=items.filter(i=>!((d[i.k]||{})[i.id]));return name+": "+(items.length-miss.length)+" su "+items.length+(miss.length?" (mancano: "+miss.map(i=>i.t).join(", ")+")":"")};
  L.push("","*Checklist*",cl(openItems(x),"Apertura"),cl(closeItems(x),"Chiusura"));
  const rec=recFor(x,"oggi"),rm=d.rec||{};
  if(rec.length){L.push("","*Attività fisse*");rec.forEach(r=>L.push((rm[r.id]?"✅ ":"⬜ ")+r.t+(rm[r.id]?" ("+rn(rm[r.id])+")":"")))}
  if(acts.length){L.push("","*Attività svolte*");acts.forEach(a=>{L.push("• "+a.t+" ("+rn(a.by)+")");cmAll(a,a.by,a.at).forEach(c=>L.push("   ↳ "+rn(c.by)+": "+c.t))})}
  const td=S.tasks.filter(t=>t.done&&t.doneAt&&ymd(new Date(t.doneAt))===x);
  if(td.length){L.push("","*ToDo completate*");td.forEach(t=>L.push("• "+t.t+" ("+rn(t.doneBy||t.to)+")"))}
  const rp=S.reports.filter(r=>rday(r)===x);
  if(rp.length){L.push("","*Segnalazioni*");rp.forEach(r=>{L.push("• "+r.t+" ("+rn(r.by)+"), "+(r.res?"risolta":"aperta"));cmAll(r,r.by,r.at).forEach(c=>L.push("   ↳ "+rn(c.by)+": "+c.t))})}

  if(d.memo&&d.memo.t)L.push("","*Promemoria per domani*",d.memo.t);
  return L.join("\n");
}

  else if(a==="claimadmin"){db.doc("meta/admin").set({uid:S.uid}).then(()=>toast("Ora sei l’amministratore")).catch(()=>toast("Non riuscito: c’è già un amministratore"))}
  else if(a==="username"){const v=el.value.trim();if(v)save(db.doc("users/"+D2.u),{name:v})}
  else if(a==="avviso"){const v=el.value.trim();editCfg(c=>{c.avviso=v?{t:v,by:S.uid,at:Date.now()}:null})}
  else if(a==="avvisoclear"){editCfg(c=>{c.avviso=null})}
  else if(a==="savememo"){const mp=memoPatch();if(!Object.keys(mp).length){toast("Scrivi il promemoria");return}save(db.doc("days/"+S.day),mp);toast("Promemoria salvato")}
  else if(a==="memoread"){save(db.doc("days/"+i),{memoDone:{by:S.uid,at:Date.now()}})}
  else if(a==="staffname"){const v=el.value.trim();if(v)editCfg(c=>{c.staff.find(s=>s.id===i).n=v})}
  else if(a==="itemname"){const v=el.value.trim();if(v)editCfg(c=>{c[k].find(x=>x.id===i).t=v})}
  else if(a==="delitem"){editCfg(c=>{c[k]=c[k].filter(x=>x.id!==i)})}
  else if(a==="additem"){const v=(S.draft["new_"+k]||"").trim();if(!v)return;S.draft["new_"+k]="";editCfg(c=>{c[k].push({id:uid8(),t:v})})}
  else if(a==="addrec"){const w=D2.w,v=(S.draft["newrec_"+w]||"").trim();if(!v)return;S.draft["newrec_"+w]="";editCfg(c=>{c.rec.push({id:uid8(),d:+w,t:v,w:S.draft["newrecw_"+w]||"oggi"})})}
  else if(a==="delrec"){editCfg(c=>{c.rec=c.rec.filter(x=>x.id!==i)})}
  else if(a==="recwhere"){const v=el.value;editCfg(c=>{const x=c.rec.find(x=>x.id===i);if(x)x.w=v})}
  else if(a==="recname"){const v=el.value.trim();if(v)editCfg(c=>{const x=c.rec.find(x=>x.id===i);if(x)x.t=v})}
}
const CH=["chk","staffname","itemname","username","avviso","taskdone","recname","recwhere","budcell","shifttime","shiftset"];
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))return;act(a,el)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))act(a,el)});
render();
</script>
</body>
</html>
