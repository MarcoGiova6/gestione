<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Gestione attività</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6a66;--br:#e2e0da;--ac:#1f6f5c;--acx:#fff;--ok:#e3f2ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#f0efeb;--mu:#a3a29c;--br:#3a3935;--ac:#4fb59b;--acx:#10201b;--ok:#1e3029;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 16px 8px;border-bottom:1px solid var(--br)}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
header h1{font-size:19px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1;min-width:80px;padding:10px 6px;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small,.mu{color:var(--mu);font-weight:400;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--br)}
.row:first-of-type{border-top:0}
.ck input{width:26px;height:26px;accent-color:var(--ac);flex:none}
.ck span{flex:1}.ck em{font-size:13px;color:var(--mu);font-style:normal}
.done{text-decoration:line-through;color:var(--mu)}
input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:11px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
select{width:100%;padding:11px;border:1px solid var(--br);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
td input[readonly]{opacity:.85}
button.b{padding:11px 16px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600}
button.g{padding:8px 12px;border:1px solid var(--br);border-radius:10px;background:transparent;color:var(--tx);font:inherit}
button.x{border:0;background:transparent;color:var(--mu);font-size:20px;padding:4px 10px}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar strong{text-align:center;flex:1;text-transform:capitalize}
.stack{display:flex;flex-direction:column;gap:8px}
.act{border-top:1px solid var(--br);padding:10px 0}
.act:first-of-type{border-top:0}
.act small{color:var(--mu)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--br);padding:4px;text-align:center}
th{font-size:14px;background:var(--bg)}
th.t{background:var(--ok)}
td input{width:100%;min-width:70px;border:0;background:transparent;color:var(--tx);font:inherit;text-align:center;padding:8px 2px}
td.n{text-align:left;font-weight:600;padding:6px 8px;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20}
.err{background:var(--ok);padding:14px;border-radius:12px}
.login{max-width:420px;margin:30px auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:13px;color:var(--mu);text-align:center;padding:4px 0}
.cal button{min-height:64px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cal button.t{border-color:var(--ac);background:var(--ok)}
.dots{display:flex;gap:3px;height:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
.d-a{background:#2e9e6b}.d-s{background:#3b7dd8}.d-r{background:#e08a1e}.d-u{background:#c0392b}
</style>
</head>
<body>
<header><div class="hd"><h1>Gestione attività</h1><button class="g" id="out" data-a="logout" hidden>Esci</button></div><nav id="nav"></nav></header>
<main id="app"><p class="mu">Caricamento…</p></main>
<div id="toast" hidden></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,setDoc,getDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDypaXlE3mPUjSf9GUQPbHSBOHZ_TBa_PM",
  authDomain:"gestione-motoabb.firebaseapp.com",
  projectId:"gestione-motoabb",
  storageBucket:"gestione-motoabb.firebasestorage.app",
  messagingSenderId:"378476037175",
  appId:"1:378476037175:web:17efeb4f6d350b95c1abb2"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),fdb=getFirestore(app);
const D={
  doc:p=>({
    onSnapshot:(n,e)=>onSnapshot(doc(fdb,p),s=>n({exists:s.exists(),data:()=>s.data()}),e),
    set:d=>setDoc(doc(fdb,p),d),
    update:d=>setDoc(doc(fdb,p),d,{merge:true}),
    delete:()=>deleteDoc(doc(fdb,p)),
    collection:c=>D.col(p+"/"+c)
  }),
  col:p=>({onSnapshot:(n,e)=>onSnapshot(collection(fdb,p),n,e)})
};

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>addDays(s,-((parse(s).getDay()+6)%7));
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid8=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const GG=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const TODAY=ymd(new Date());
const defStaff=[{id:"s1",n:"Persona 1"},{id:"s2",n:"Persona 2"},{id:"s3",n:"Persona 3"}];
const defOpen=["Accendere luci e impianti","Controllare la cassa","Controllare ordini e consegne","Verificare pulizia e ordine"].map((t,i)=>({id:"o"+i,t}));
const defClose=["Spegnere luci e impianti","Chiusura cassa","Pulizia e riordino","Chiudere porte e inserire l’allarme"].map((t,i)=>({id:"c"+i,t}));
const S={tab:"oggi",day:TODAY,week:mondayOf(TODAY),cfg:null,loaded:false,authReady:false,dayDoc:{},acts:[],wk:{},todos:[],names:{},draft:{},confirm:"",uid:null,email:"",err:"",loginErr:"",pending:false,adminUid:null,adminLoaded:false,tasks:[],reports:[],daysAll:{},month:TODAY.slice(0,8)+"01",healed:""};
const subs={};
const eff=()=>{const c=S.cfg||{};return{staff:c.staff||defStaff,open:c.open||defOpen,close:c.close||defClose,rec:c.rec||[]}};
const nm=id=>id===S.uid?"Tu":(S.names[id]||"Collega");
const isAdmin=()=>!!S.uid&&S.adminUid===S.uid;
const rday=r=>r.day||ymd(new Date(r.at||0));
const fmtDay=x=>parse(x).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const GGL=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"];
const wdi=x=>(parse(x).getDay()+6)%7;
function openDay(x){S.day=x;S.tab="oggi";S.confirm="";delete S.draft.sum;watchDay();render();scrollTo(0,0)}
const hm=t=>t?new Date(t).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}):"";
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2500)}
const fail=e=>{S.err="Problema di connessione ai dati ("+((e&&e.code)||"errore")+").";render()};
async function save(ref,data){try{await ref.update(data)}catch(e){toast("Salvataggio non riuscito")}}
function watchDay(){
  ["day","acts"].forEach(k=>subs[k]&&subs[k]());S.dayDoc={};S.acts=[];
  const r=D.doc("days/"+S.day);
  subs.day=r.onSnapshot(s=>{S.dayDoc=s.exists?s.data():{};render()},fail);
  subs.acts=r.collection("acts").onSnapshot(q=>{S.acts=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));if(S.acts.length&&!S.dayDoc.hasActs&&S.healed!==S.day){S.healed=S.day;save(D.doc("days/"+S.day),{hasActs:true})}render()},fail);
}
function watchWeek(){
  subs.wk&&subs.wk();S.wk={};
  subs.wk=D.doc("weeks/"+S.week).onSnapshot(s=>{S.wk=s.exists?(s.data().cells||{}):{};render()},fail);
}
async function start(u){
  S.uid=u.uid;S.email=u.email||"";
  try{const r=doc(fdb,"users/"+S.uid);const s=await getDoc(r);
    if(!s.exists()){const n=S.email.split("@")[0];await setDoc(r,{name:n.charAt(0).toUpperCase()+n.slice(1)})}}catch(e){}
  subs.users=D.col("users").onSnapshot(q=>{q.docs.forEach(d=>S.names[d.id]=(d.data()||{}).name);render()},fail);
  subs.cfg=D.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.loaded=true;render()},fail);
  subs.todos=D.col("users/"+S.uid+"/todos").onSnapshot(q=>{S.todos=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));render()},fail);
  subs.admin=D.doc("meta/admin").onSnapshot(s=>{S.adminUid=s.exists?(s.data().uid||null):null;S.adminLoaded=true;render()},fail);
  subs.tasks=D.col("tasks").onSnapshot(q=>{S.tasks=q.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  subs.reports=D.col("reports").onSnapshot(q=>{S.reports=q.docs.map(d=>({id:d.id,...d.data()}));render()},fail);
  subs.days=D.col("days").onSnapshot(q=>{const m={};q.docs.forEach(d=>m[d.id]=d.data());S.daysAll=m;render()},fail);
  watchDay();watchWeek();
}
onAuthStateChanged(auth,u=>{S.authReady=true;if(u)start(u);else{S.uid=null;render()}});
function editCfg(fn){
  const c=JSON.parse(JSON.stringify(eff()));fn(c);S.cfg=c;
  D.doc("config/main").set(c).catch(()=>toast("Solo l’amministratore può modificarlo"));render();
}
function viewLogin(){
  return `<section class="card login"><h2>Accedi</h2><div class="stack">
  <input type="email" autocapitalize="off" autocomplete="username" data-d="em" placeholder="Email" value="${esc(S.draft.em||"")}">
  <input type="password" autocomplete="current-password" data-d="pw" placeholder="Password" value="${esc(S.draft.pw||"")}">
  ${S.loginErr?`<div class="err">${esc(S.loginErr)}</div>`:""}
  <button class="b" data-a="login">Entra</button></div></section>`;
}
function reportsCard(){
  const list=S.reports.filter(r=>rday(r)===S.day).sort((a,b)=>(a.res?1:0)-(b.res?1:0)||(b.u?1:0)-(a.u?1:0)||(a.at||0)-(b.at||0));
  const open=list.filter(r=>!r.res);
  return `<section class="card" ${open.some(r=>r.u)?'style="border-color:#c0392b"':""}><h2>Segnalazioni<small>${list.length}${open.length?" · "+open.length+" aperte":""}</small></h2><div class="stack">
   <input type="text" data-d="rp" placeholder="Cosa non va? Cosa serve?" value="${esc(S.draft.rp||"")}">
   <label class="row ck" style="border:0;padding:0"><input type="checkbox" data-a="rpu" ${S.draft.rpu?"checked":""}><span>Urgente</span></label>
   <button class="b" data-a="addreport">Invia segnalazione</button></div>`+
  list.map(r=>`<div class="act"><div style="display:flex;justify-content:space-between;gap:8px"><strong class="${r.res?"done":""}">${r.u?"⚠ ":""}${esc(r.t)}</strong>${(isAdmin()||r.by===S.uid)?`<button class="x" data-a="delreport" data-i="${r.id}">✕</button>`:""}</div><small>${esc(nm(r.by))} · ${hm(r.at)}${r.res?" · risolta da "+esc(nm(r.resBy)):""}</small>${r.res?"":`<div style="margin-top:6px"><button class="g" data-a="resolve" data-i="${r.id}">Segna come risolta</button></div>`}</div>`).join("")+`</section>`;
}
function carryCard(){
  if(S.day!==TODAY)return "";
  const old=S.reports.filter(r=>!r.res&&rday(r)<TODAY).sort((a,b)=>(b.u?1:0)-(a.u?1:0)||(a.at||0)-(b.at||0));
  if(!old.length)return "";
  return `<section class="card" style="border-color:#c0392b"><h2>Segnalazioni ancora aperte<small>giorni precedenti</small></h2>`+
  old.map(r=>`<div class="act"><strong>${r.u?"⚠ ":""}${esc(r.t)}</strong><br><small>${esc(nm(r.by))} · ${esc(fmtDay(rday(r)))}</small><div style="margin-top:6px;display:flex;gap:8px"><button class="g" data-a="resolve" data-i="${r.id}">Segna come risolta</button><button class="g" data-a="goday" data-i="${rday(r)}">Apri giorno</button></div></div>`).join("")+`</section>`;
}
function viewTasks(){
  const recent=t=>!t.done||(Date.now()-(t.doneAt||0)<2.592e8);
  const sorted=a=>a.filter(recent).sort((x,y)=>(x.done?1:0)-(y.done?1:0)||(x.at||0)-(y.at||0));
  const mine=sorted(S.tasks.filter(t=>t.to===S.uid)),given=sorted(S.tasks.filter(t=>t.by===S.uid&&t.to!==S.uid));
  const opts=Object.entries(S.names).filter(([id])=>id!==S.uid).map(([id,n])=>`<option value="${id}" ${S.draft.tkto===id?"selected":""}>${esc(n)}</option>`).join("");
  return `<section class="card"><h2>Assegnate a te<small>${mine.filter(t=>!t.done).length} da fare</small></h2>`+
  (mine.map(t=>`<label class="row ck"><input type="checkbox" data-a="taskdone" data-i="${t.id}" ${t.done?"checked":""}><span class="${t.done?"done":""}">${esc(t.t)}</span><em>da ${esc(nm(t.by))}</em></label>`).join("")||`<p class="mu">Nessuna attività assegnata.</p>`)+`</section>
  <section class="card"><h2>Assegna a un collega</h2><div class="stack"><input type="text" data-d="tk" placeholder="Cosa deve fare?" value="${esc(S.draft.tk||"")}"><select data-d="tkto"><option value="">Scegli il collega…</option>${opts}</select><button class="b" data-a="addtask">Assegna</button></div>`+
  given.map(t=>`<div class="row ck"><span class="${t.done?"done":""}">${esc(t.t)}</span><em>${t.done?"✓ ":""}${esc(nm(t.to))}</em>${(isAdmin()||t.by===S.uid)?`<button class="x" data-a="deltask" data-i="${t.id}">✕</button>`:""}</div>`).join("")+`<p class="mu">I colleghi compaiono nell’elenco dopo il primo accesso.</p></section>`;
}
function viewOggi(){
  const c=eff(),d=S.dayDoc;
  const chk=(k,items,title)=>{const m=d[k]||{},n=items.filter(i=>m[i.id]).length;
    return `<section class="card"><h2>${title}<small>${n}/${items.length}</small></h2>`+
    (items.map(i=>`<label class="row ck"><input type="checkbox" data-a="chk" data-k="${k}" data-i="${i.id}" ${m[i.id]?"checked":""}><span class="${m[i.id]?"done":""}">${esc(i.t)}</span>${m[i.id]?`<em>${esc(nm(m[i.id]))}</em>`:""}</label>`).join("")||`<p class="mu">Nessuna voce: l’amministratore le aggiunge da Impostazioni.</p>`)+`</section>`};
  const label=parse(S.day).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const sum=S.draft.sum!==undefined?S.draft.sum:(d.sum||"");
  const rec=c.rec.filter(r=>r.d===wdi(S.day)).map(r=>({id:r.id,t:r.t}));
  return `<div class="bar"><button class="g" data-a="dprev">‹</button><strong>${esc(label)}</strong><button class="g" data-a="dnext">›</button></div>`+
  (S.day!==TODAY?`<p style="text-align:center;margin-top:-6px"><button class="g" data-a="dtoday">Torna a oggi</button></p>`:"")+
  carryCard()+
  chk("open",c.open,"Apertura")+
  (rec.length?chk("rec",rec,"Attività fisse · "+GGL[wdi(S.day)]):"")+
  `<section class="card"><h2>Attività svolte<small>${S.acts.length}</small></h2><div class="stack">
    <input type="text" data-d="at" placeholder="Cosa è stato fatto?" value="${esc(S.draft.at||"")}">
    <input type="text" data-d="ac" placeholder="Commento (facoltativo)" value="${esc(S.draft.ac||"")}">
    <button class="b" data-a="addact">Aggiungi attività</button></div>`+
  S.acts.map(a=>`<div class="act"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(a.t)}</strong>${!(isAdmin()||a.by===S.uid)?"":S.confirm===a.id?`<button class="g" data-a="delact" data-i="${a.id}">Elimina?</button>`:`<button class="x" data-a="askdel" data-i="${a.id}">✕</button>`}</div>
    <small>${esc(nm(a.by))} · ${hm(a.at)}</small>
    <input type="text" style="margin-top:6px" data-a="actc" data-i="${a.id}" placeholder="Aggiungi un commento…" value="${esc(a.c||"")}"></div>`).join("")+`</section>`+
  reportsCard()+
  chk("close",c.close,"Chiusura")+
  `<section class="card"><h2>Riepilogo di fine giornata</h2><textarea data-d="sum" placeholder="Com’è andata la giornata?">${esc(sum)}</textarea>
   <div class="bar" style="margin:10px 0 0"><span class="mu">${d.sumBy?"Ultimo salvataggio: "+esc(nm(d.sumBy))+" alle "+hm(d.sumAt):""}</span><button class="b" data-a="savesum">Salva riepilogo</button></div></section>`;
}
function viewCal(){
  const first=parse(S.month),y=first.getFullYear(),mo=first.getMonth();
  const dim=new Date(y,mo+1,0).getDate(),off=(first.getDay()+6)%7,rows=Math.ceil((off+dim)/7);
  const lab=first.toLocaleDateString("it-IT",{month:"long",year:"numeric"});
  const rd={};S.reports.forEach(r=>{const k=rday(r);const o=rd[k]||(rd[k]={n:0,u:0});o.n++;if(!r.res&&r.u)o.u++});
  let cells=GG.map(g=>`<div class="h">${g}</div>`).join("");
  for(let i=0;i<rows*7;i++){
    const n=i-off+1;
    if(n<1||n>dim){cells+=`<div></div>`;continue}
    const x=y+"-"+pad(mo+1)+"-"+pad(n),da=S.daysAll[x]||{},r=rd[x];
    cells+=`<button data-a="goday" data-i="${x}" class="${x===TODAY?"t":""}"><span>${n}</span><span class="dots">${da.hasActs?'<i class="dot d-a"></i>':""}${da.sum?'<i class="dot d-s"></i>':""}${r?`<i class="dot ${r.u?"d-u":"d-r"}"></i>`:""}</span></button>`;
  }
  return `<div class="bar"><button class="g" data-a="mprev">‹</button><strong>${esc(lab)}</strong><button class="g" data-a="mnext">›</button></div>`+
  (S.month!==TODAY.slice(0,8)+"01"?`<p style="text-align:center;margin-top:-6px"><button class="g" data-a="mtoday">Questo mese</button></p>`:"")+
  `<section class="card"><div class="cal">${cells}</div><p class="mu" style="margin-bottom:0"><i class="dot d-a"></i> attività · <i class="dot d-s"></i> riepilogo · <i class="dot d-r"></i> segnalazioni (<i class="dot d-u"></i> urgente ancora aperta)</p><p class="mu">Tocca un giorno per vedere attività, segnalazioni e riepilogo.</p></section>`;
}
function viewPlanner(){
  const c=eff(),days=[0,1,2,3,4,5,6].map(i=>addDays(S.week,i));
  const lab=parse(days[0]).toLocaleDateString("it-IT",{day:"numeric",month:"short"})+" – "+parse(days[6]).toLocaleDateString("it-IT",{day:"numeric",month:"short"});
  return `<div class="bar"><button class="g" data-a="wprev">‹</button><strong>Settimana ${esc(lab)}</strong><button class="g" data-a="wnext">›</button></div>
  ${S.week!==mondayOf(TODAY)?`<p style="text-align:center;margin-top:-6px"><button class="g" data-a="wtoday">Questa settimana</button></p>`:""}
  <section class="card"><div class="tw"><table><tr><th></th>${days.map((x,i)=>`<th class="${x===TODAY?"t":""}">${GG[i]}<br>${parse(x).getDate()}</th>`).join("")}</tr>
  ${c.staff.map(s=>`<tr><td class="n">${esc(s.n)}</td>${days.map(x=>{const k=x+"_"+s.id;return `<td><input type="text" data-a="cell" data-c="${k}" placeholder="–" ${isAdmin()?"":"readonly"} value="${esc(S.wk[k]||"")}"></td>`}).join("")}</tr>`).join("")}</table></div>
  <p class="mu">${isAdmin()?"Scrivi il turno in ogni casella (es. 9–17, riposo, ferie).":"Solo l’amministratore può modificare i turni."}</p></section>`;
}
function viewTodo(){
  const done=S.todos.filter(t=>t.done).length;
  return `<section class="card"><h2>Le mie cose da fare<small>solo tu le vedi</small></h2><div class="stack">
   <input type="text" data-d="todo" placeholder="Nuova cosa da fare" value="${esc(S.draft.todo||"")}"><button class="b" data-a="addtodo">Aggiungi</button></div>`+
  S.todos.map(t=>`<label class="row ck"><input type="checkbox" data-a="todo" data-i="${t.id}" ${t.done?"checked":""}><span class="${t.done?"done":""}">${esc(t.t)}</span><button class="x" data-a="deltodo" data-i="${t.id}">✕</button></label>`).join("")+
  (done?`<p><button class="g" data-a="cleardone">Elimina completate (${done})</button></p>`:"")+`</section>`;
}
function recCfg(){
  const rec=eff().rec;
  return `<section class="card"><h2>Cadenze fisse<small>ogni settimana</small></h2><p class="mu" style="margin-top:0">Attività che compaiono ogni settimana nel giorno indicato. In Oggi tutti possono spuntarle.</p>`+
  GGL.map((n,w)=>`<h3 style="font-size:16px;margin:14px 0 4px">${n}</h3>`+
    rec.filter(r=>r.d===w).map(r=>`<div class="row"><input type="text" data-a="recname" data-i="${r.id}" value="${esc(r.t)}"><button class="x" data-a="delrec" data-i="${r.id}">✕</button></div>`).join("")+
    `<div class="row"><input type="text" data-d="newrec_${w}" placeholder="Nuova attività del ${n.toLowerCase()}" value="${esc(S.draft["newrec_"+w]||"")}"><button class="g" data-a="addrec" data-w="${w}">Aggiungi</button></div>`).join("")+`</section>`;
}
function viewSet(){
  const c=eff(),adm=isAdmin();
  const items=(k,title)=>`<section class="card"><h2>${title}</h2>`+c[k].map(i=>`<div class="row"><input type="text" data-a="itemname" data-k="${k}" data-i="${i.id}" value="${esc(i.t)}"><button class="x" data-a="delitem" data-k="${k}" data-i="${i.id}">✕</button></div>`).join("")+
   `<div class="row"><input type="text" data-d="new_${k}" placeholder="Nuova voce" value="${esc(S.draft["new_"+k]||"")}"><button class="g" data-a="additem" data-k="${k}">Aggiungi</button></div></section>`;
  let h=`<section class="card"><h2>Il tuo nome</h2><input type="text" data-a="myname" value="${esc(S.names[S.uid]||"")}"><p class="mu">È il nome che vedono i colleghi accanto alle tue azioni. Accesso: ${esc(S.email)}${adm?" · Amministratore":""}</p></section>`;
  if(S.adminLoaded&&!S.adminUid)h+=`<section class="card"><h2>Amministratore</h2><p>Non c’è ancora un amministratore. Solo l’amministratore può modificare planner, nomi del personale, voci delle checklist ed eliminare le attività dei colleghi.</p><p class="mu">Fallo tu per primo, prima di far entrare i colleghi: dopo non si cambia da qui.</p><button class="b" data-a="claimadmin">Imposta me come amministratore</button></section>`;
  if(!adm)return h+(S.adminUid?`<p class="mu">Planner, nomi del personale e voci delle checklist le modifica solo l’amministratore.</p>`:"");
  return h+`<section class="card"><h2>Nomi del personale</h2>`+c.staff.map(s=>`<div class="row"><input type="text" data-a="staffname" data-i="${s.id}" value="${esc(s.n)}"></div>`).join("")+`<p class="mu">Compaiono nel planner dei turni.</p></section>`+items("open","Voci checklist apertura")+items("close","Voci checklist chiusura")+recCfg();
}
function render(){
  const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$("#app").contains(a)){S.pending=true;return}
  S.pending=false;
  const app=$("#app"),logged=!!S.uid;
  const urg=S.reports.filter(r=>!r.res&&r.u).length,mine=S.tasks.filter(t=>t.to===S.uid&&!t.done).length;
  $("#out").hidden=!logged;
  $("#nav").innerHTML=logged?[["oggi","Oggi"+(urg?" ⚠":"")],["cal","Calendario"],["plan","Planner"],["todo","Todo"+(mine?" ("+mine+")":"")],["set","Impostazioni"]].map(([k,l])=>`<button data-a="tab" data-i="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join(""):"";
  if(!S.authReady){app.innerHTML=`<p class="mu">Caricamento…</p>`;return}
  if(!logged){app.innerHTML=viewLogin();return}
  if(!S.loaded){app.innerHTML=(S.err?`<p class="err">${esc(S.err)}</p>`:`<p class="mu">Caricamento…</p>`);return}
  app.innerHTML=(S.err?`<p class="err">${esc(S.err)}</p>`:"")+(S.adminLoaded&&!S.adminUid&&S.tab!=="set"?`<p class="err">Nessun amministratore impostato: vai in Impostazioni.</p>`:"")+({oggi:viewOggi,cal:viewCal,plan:viewPlanner,todo:()=>viewTasks()+viewTodo(),set:viewSet}[S.tab])();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending)render()},60));
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.d;if(k)S.draft[k]=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.d){const m={at:"addact",ac:"addact",todo:"addtodo",em:"login",pw:"login",rp:"addreport",tk:"addtask"};const k=e.target.dataset.d;let a=m[k],el=e.target;if(!a&&(k.startsWith("new_")||k.startsWith("newrec_"))){el=e.target.parentElement.querySelector("button[data-a]");a=el&&el.dataset.a}if(a){e.preventDefault();act(a,el);e.target.blur()}}});
function act(a,el){
  const D2=el.dataset,db=D,i=D2.i,k=D2.k;
  if(a==="login"){
    const em=(S.draft.em||"").trim(),pw=S.draft.pw||"";
    if(!em||!pw){S.loginErr="Inserisci email e password.";S.pending=false;render();return}
    signInWithEmailAndPassword(auth,em,pw).then(()=>{S.draft.pw="";S.loginErr=""}).catch(e=>{
      S.loginErr=/invalid|wrong|user-not-found/.test(e.code||"")?"Email o password errati.":"Accesso non riuscito ("+(e.code||"errore")+").";render()});
  }
  else if(a==="logout"){signOut(auth).then(()=>location.reload())}
  else if(a==="tab"){S.tab=i;render();scrollTo(0,0)}
  else if(a==="dprev"||a==="dnext"||a==="dtoday"){S.day=a==="dtoday"?TODAY:addDays(S.day,a==="dprev"?-1:1);delete S.draft.sum;S.confirm="";watchDay();render()}
  else if(a==="wprev"||a==="wnext"||a==="wtoday"){S.week=a==="wtoday"?mondayOf(TODAY):addDays(S.week,a==="wprev"?-7:7);watchWeek();render()}
  else if(a==="chk"){save(db.doc("days/"+S.day),{[k]:{[i]:el.checked?S.uid:""}})}
  else if(a==="addact"){const t=(S.draft.at||"").trim();if(!t){toast("Scrivi cosa è stato fatto");return}
    const c=(S.draft.ac||"").trim(),id=uid8();S.draft.at="";S.draft.ac="";
    db.doc("days/"+S.day+"/acts/"+id).set({t,c,by:S.uid,at:Date.now()}).catch(()=>toast("Salvataggio non riuscito"));save(db.doc("days/"+S.day),{hasActs:true});render()}
  else if(a==="actc"){save(db.doc("days/"+S.day+"/acts/"+i),{c:el.value.trim()})}
  else if(a==="askdel"){S.confirm=i;render()}
  else if(a==="delact"){S.confirm="";if(S.acts.length<=1)save(db.doc("days/"+S.day),{hasActs:false});db.doc("days/"+S.day+"/acts/"+i).delete().catch(()=>toast("Operazione non riuscita"));render()}
  else if(a==="savesum"){const v=S.draft.sum!==undefined?S.draft.sum:(S.dayDoc.sum||"");delete S.draft.sum;save(db.doc("days/"+S.day),{sum:v.trim(),sumBy:S.uid,sumAt:Date.now()});toast("Riepilogo salvato")}
  else if(a==="cell"){save(db.doc("weeks/"+S.week),{cells:{[D2.c]:el.value.trim()}})}
  else if(a==="addtodo"){const t=(S.draft.todo||"").trim();if(!t)return;S.draft.todo="";
    db.doc("users/"+S.uid+"/todos/"+uid8()).set({t,done:false,at:Date.now()}).catch(()=>toast("Salvataggio non riuscito"));render()}
  else if(a==="todo"){save(db.doc("users/"+S.uid+"/todos/"+i),{done:el.checked})}
  else if(a==="deltodo"){db.doc("users/"+S.uid+"/todos/"+i).delete().catch(()=>{})}
  else if(a==="cleardone"){S.todos.filter(t=>t.done).forEach(t=>db.doc("users/"+S.uid+"/todos/"+t.id).delete().catch(()=>{}))}
  else if(a==="rpu"){S.draft.rpu=el.checked}
  else if(a==="addreport"){const t=(S.draft.rp||"").trim();if(!t){toast("Scrivi la segnalazione");return}
    const u=!!S.draft.rpu;S.draft.rp="";S.draft.rpu=false;
    db.doc("reports/"+uid8()).set({t,u,by:S.uid,at:Date.now(),res:false,day:S.day}).catch(()=>toast("Salvataggio non riuscito"));render()}
  else if(a==="resolve"){save(db.doc("reports/"+i),{res:true,resBy:S.uid,resAt:Date.now()})}
  else if(a==="delreport"){db.doc("reports/"+i).delete().catch(()=>toast("Operazione non riuscita"))}
  else if(a==="addtask"){const t=(S.draft.tk||"").trim(),to=S.draft.tkto||"";if(!t){toast("Scrivi cosa deve fare");return}if(!to){toast("Scegli il collega");return}
    S.draft.tk="";db.doc("tasks/"+uid8()).set({t,to,by:S.uid,at:Date.now(),done:false}).catch(()=>toast("Salvataggio non riuscito"));render()}
  else if(a==="taskdone"){save(db.doc("tasks/"+i),{done:el.checked,doneAt:el.checked?Date.now():0})}
  else if(a==="deltask"){db.doc("tasks/"+i).delete().catch(()=>toast("Operazione non riuscita"))}
  else if(a==="claimadmin"){db.doc("meta/admin").set({uid:S.uid}).then(()=>toast("Ora sei l’amministratore")).catch(()=>toast("Non riuscito: c’è già un amministratore"))}
  else if(a==="goday"){openDay(i)}
  else if(a==="mprev"||a==="mnext"||a==="mtoday"){if(a==="mtoday")S.month=TODAY.slice(0,8)+"01";else{const m=parse(S.month);m.setMonth(m.getMonth()+(a==="mprev"?-1:1));S.month=ymd(m)}render()}
  else if(a==="addrec"){const w=D2.w,v=(S.draft["newrec_"+w]||"").trim();if(!v)return;S.draft["newrec_"+w]="";editCfg(c=>{c.rec.push({id:uid8(),d:+w,t:v})})}
  else if(a==="delrec"){editCfg(c=>{c.rec=c.rec.filter(x=>x.id!==i)})}
  else if(a==="recname"){const v=el.value.trim();if(v)editCfg(c=>{const x=c.rec.find(x=>x.id===i);if(x)x.t=v})}
  else if(a==="myname"){const v=el.value.trim();if(v)save(db.doc("users/"+S.uid),{name:v})}
  else if(a==="staffname"){const v=el.value.trim();if(v)editCfg(c=>{c.staff.find(s=>s.id===i).n=v})}
  else if(a==="itemname"){const v=el.value.trim();if(v)editCfg(c=>{c[k].find(x=>x.id===i).t=v})}
  else if(a==="delitem"){editCfg(c=>{c[k]=c[k].filter(x=>x.id!==i)})}
  else if(a==="additem"){const v=(S.draft["new_"+k]||"").trim();if(!v)return;S.draft["new_"+k]="";editCfg(c=>{c[k].push({id:uid8(),t:v})})}
}
const CH=["chk","todo","cell","actc","staffname","itemname","myname","rpu","taskdone","recname"];
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))return;act(a,el)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))act(a,el)});
render();
</script>
</body>
</html>
