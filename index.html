<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Gestione</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestione">
<meta name="theme-color" content="#e8e9eb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#e8e9eb;--sf:#f9f9fa;--ink:#16171a;--mu:#666b73;--ln:#d2d4d8;--ln2:#b4b8bf;--fill:#ecedef;
  --hv:#d6f230;--hvx:#16171a;
  --pri:#16171a;--prix:#ffffff;--ckbg:#16171a;--ckfg:#d6f230;--foc:#16171a;
  --go:#1f9d57;--warn:#b27700;--warnbg:#fbf0d4;--bad:#d1332a;--badbg:#fbe6e4;--gobg:#d9f1e3;--gotx:#ffffff;
  --panel:#16171a;--panelx:#f2f3f4;--panelmu:#9a9ea6;--panelln:#34363b;--panelfill:#26282c;
  --bgf:rgba(232,233,235,.86);
  --disp:"DIN Condensed","Avenir Next Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0e10;--sf:#17181b;--ink:#f2f3f4;--mu:#9a9ea6;--ln:#2b2d31;--ln2:#42454c;--fill:#232529;
  --pri:#d6f230;--prix:#16171a;--ckbg:#d6f230;--ckfg:#16171a;--foc:#d6f230;
  --go:#3ecf80;--warn:#f2b83c;--warnbg:#3a2d10;--bad:#ff6b60;--badbg:#3b1a18;--gobg:#14301f;--gotx:#0d0e10;
  --panel:#1d1f23;--panelln:#33363c;--panelfill:#2b2e33;--bgf:rgba(13,14,16,.86);color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:var(--sans);cursor:pointer;transition:transform .12s,background .15s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--foc);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:var(--bgf);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.top h1{margin:0;font:400 28px/1 var(--disp);letter-spacing:.01em}
.chip{width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font:700 15px var(--sans)}
main{max-width:760px;margin:0 auto;padding:6px 16px calc(100px + env(safe-area-inset-bottom))}
main.wide{max-width:1100px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--bgf);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-top:1px solid var(--ln)}
.tabs:empty{display:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:1 0 64px;min-width:0;max-width:130px;border:0;background:transparent;color:var(--mu);font:600 10.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0}
.tabs .ic{width:44px;height:29px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink)}
.tabs button.on .ic{background:var(--hv);color:var(--hvx)}
.bd{position:absolute;top:-2px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--sans);text-align:center}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.pn.alert{border:1.5px solid var(--warn)}
.pn.ok{border:1.5px solid var(--go)}
input[type=date]{min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.dlg{max-height:86vh;overflow:auto;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:24px 22px 20px;z-index:51;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbg.clr{background:transparent}
.pop{position:fixed;top:calc(56px + env(safe-area-inset-top));right:14px;z-index:51;background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:6px;min-width:210px;display:flex;flex-direction:column}
.pop button{border:0;background:transparent;color:var(--ink);font:600 16px var(--sans);text-align:left;padding:13px 14px;border-radius:9px}
.pop button:active{background:var(--fill)}
.pli{padding:9px 0;border-top:1px solid var(--ln);font-weight:600}
.pli:first-child{border-top:0}
.pli input{margin-top:6px;font-weight:400}
.nmb{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:6px 0;text-align:left;text-decoration:underline dotted;text-underline-offset:4px}
.dlg h2{margin:0;font:400 30px/1.05 var(--disp);letter-spacing:.01em}
.dlg p{margin:0 0 6px;color:var(--mu)}
.dlg .b,.dlg .g{width:100%;padding:14px}
a.b{display:block;text-align:center;text-decoration:none;border-radius:11px}
.pn.avv{background:var(--hv);color:var(--hvx);border-color:transparent}
.pn.avv .ph h2{color:var(--hvx)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.ph h2{margin:0;font:400 24px/1.1 var(--disp);letter-spacing:.01em}
.ph small{font:600 13.5px var(--sans);color:var(--mu);text-align:right;white-space:nowrap}
.mu{color:var(--mu);font-size:14px;margin:8px 0}
.seg{display:flex;gap:3px;margin:2px 0 6px}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--ln)}
.seg i.f{background:var(--ink)}
.seg.all i.f{background:var(--go)}
.list{display:block}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.list>.row:first-child,.list>.act:first-child{border-top:0}
.ck{cursor:pointer}
.ck input{position:absolute;opacity:0;left:0;width:28px;height:28px;margin:0}
.bx{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--ln2);background:var(--sf);position:relative;transition:background .15s,border-color .15s}
.ck input:checked+.bx{background:var(--ckbg);border-color:var(--ckbg)}
.ck input:checked+.bx::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--ckfg);border-width:0 3px 3px 0;transform:rotate(45deg)}
.ck input:focus-visible+.bx{outline:3px solid var(--foc);outline-offset:2px}
.tx{flex:1}
.ck.dn .tx{color:var(--mu);text-decoration:line-through}
.who{font-size:13px;color:var(--mu);text-align:right}
.sub{display:block;color:var(--mu);font-size:13px;margin-top:2px;white-space:pre-line}
.sr{align-items:flex-start;padding:10px 0}
.mk{flex:none;width:20px;text-align:center;font-weight:700;color:var(--mu)}
.mk.ok{color:var(--go)}
.act{padding:12px 0;border-top:1px solid var(--ln)}
.act .line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.meta{display:flex;gap:8px;font-size:13px;color:var(--mu)}
.meta b{color:var(--ink);font-weight:600}
.act input[type=text]{margin-top:8px}
.cmadd{display:flex;gap:8px;margin-top:8px}
select.sm{width:auto;flex:none;padding:12px 10px}
.row input[type=text]{min-width:0}
.cmadd input[type=text]{flex:1;min-width:0}
.rp{padding:12px 0;border-top:1px solid var(--ln)}
.list>.rp:first-child{border-top:0}
.rph{display:flex;align-items:center;gap:10px}
.rpb{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:0;color:var(--ink);font:inherit;display:block}
.rpt{display:block;font-weight:600}
.rd .rpt{color:var(--mu);text-decoration:line-through;font-weight:500}
.rp .meta{flex-wrap:wrap;margin-top:2px}
.rpx{margin-top:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pgrid .pn{margin-bottom:0}
.pdh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.pdh b{font:400 23px/1.1 var(--disp);letter-spacing:.01em}
.pdh span{color:var(--mu);font-size:14px}
.pn.today{border:2px solid var(--ink)}
.pn.bdnow{border:2px solid var(--ink)}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bstats span{display:block;color:var(--mu);font-size:13px}
.bstats b{font:400 21px/1.2 var(--disp);white-space:nowrap}
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
.wgrid span{display:block;font:600 12px var(--sans);color:var(--mu);text-align:center;margin-bottom:3px}
.wgrid input[type=text]{padding:10px 0;text-align:center;font-size:15px;min-width:0}
.pn.bdc{padding:0;overflow:hidden}
.bdh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left}
.bdn{min-width:58px;font-size:16px}
.bdm{flex:1;color:var(--mu);font-size:13.5px}
.bdd{font-weight:700;font-size:14px;white-space:nowrap}
.bdd.up{color:var(--go)}
.bdd.dn{color:var(--warn)}
.bdx{padding:0 16px 14px}
.bdr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--ln);font-size:15px}
.bdr span{color:var(--mu);flex:none}
.bdr b{text-align:right}

.mc .ph h2,.pn.mc h2{font-size:21px}.mbar{height:10px;border-radius:6px;background:var(--fill);margin-top:12px;overflow:hidden}
.mbar i{display:block;height:100%;border-radius:6px;background:var(--ink)}
.mbar i.full{background:var(--go)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis span{display:block;color:var(--mu);font-size:13px}
.kpis b{font:400 30px/1.15 var(--disp);white-space:nowrap}
.krh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.krh span{color:var(--mu);font-size:13px}
.rv input[type=time]{width:130px;min-height:46px;padding:10px 12px;border:1px solid transparent;border-radius:10px;background:var(--fill);color:var(--ink);font:inherit;text-align:right;-webkit-appearance:none;appearance:none}
.rv select{padding:12px 10px}
.rv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.rv input[type=text]{width:130px;text-align:right}
.pn.today .pdh b{background:var(--hv);color:var(--hvx);padding:2px 9px;border-radius:7px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-weight:600}
.pdh+.prow{border-top:0}
.sp{min-width:112px;border:1px dashed var(--ln2);border-radius:10px;padding:10px 12px;font:600 14px var(--sans);background:transparent;color:var(--mu);text-align:center}
select.sp{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;cursor:pointer;width:auto}
.sp.w{background:var(--hv);color:var(--hvx);border-color:transparent}
.sp.r{background:var(--fill);color:var(--mu);border-color:transparent}
.sp.f{background:var(--warnbg);color:var(--warn);border-color:transparent}
.sp.m{background:var(--badbg);color:var(--bad);border-color:transparent}
.act .cmadd input[type=text]{margin-top:0;flex:1}
.cm{font-size:14px;margin-top:8px;padding-left:10px;border-left:3px solid var(--ln)}
.cm b{font-weight:600}
.cm small{color:var(--mu);margin-left:6px;font-size:12.5px}
input[type=text],input[type=email],input[type=password],input[type=date],textarea,select{width:100%;padding:12px 14px;border:1px solid transparent;border-radius:10px;background:var(--fill);color:var(--ink);font:inherit}
textarea{min-height:100px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.b{border:0;border-radius:11px;padding:13px 18px;background:var(--pri);color:var(--prix);font:700 15px var(--sans)}
.g{border:0;border-radius:10px;padding:10px 15px;background:var(--fill);color:var(--ink);font:600 14px var(--sans)}
.sq{width:42px;height:42px;padding:0;font-size:22px;line-height:1;border-radius:12px}
.x{border:0;background:transparent;color:var(--mu);font-size:20px;padding:2px 10px;line-height:1}
.btns{display:flex;gap:10px;margin-top:12px;justify-content:flex-end;flex-wrap:wrap}
.dh{display:flex;align-items:center;gap:10px;margin:10px 0 16px}
.dnum{font:400 70px/.88 var(--disp);letter-spacing:.005em;margin-right:4px}
.dt{flex:1;line-height:1.2}
.dt b{display:block;font:700 19px var(--sans);text-transform:capitalize}
.dt span{color:var(--mu);font-size:14.5px;text-transform:capitalize}
.back{margin:-6px 0 14px}
.note{background:var(--warnbg);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.fld{display:block;margin:12px 0}
.fld span{display:block;font:600 13.5px var(--sans);color:var(--mu);margin-bottom:5px}
.login{max-width:420px;margin:40px auto}
.login h2{font-size:38px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font:600 12.5px var(--sans);color:var(--mu);text-align:center;padding:2px 0 4px}
.cal button{min-height:66px;border:0;border-radius:11px;background:var(--fill);color:var(--ink);font:600 15px var(--sans);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.cal button.t{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:4px;height:7px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle}
.d-a{background:var(--ink)}.cal .t .d-a{background:var(--bg)}
.d-s{background:var(--go)}.d-r{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mu);margin:14px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.pt{min-width:700px}.bt{min-width:620px}
th,td{border:1px solid var(--ln);padding:3px;text-align:center}
th{font:600 13.5px/1.25 var(--sans);background:var(--fill);padding:8px 4px}
th.t{background:var(--hv);color:var(--hvx)}
td.n{text-align:left;font-weight:600;padding:6px 10px;white-space:nowrap;position:sticky;left:0;background:var(--sf)}
td input{width:100%;min-width:64px;border:0;background:transparent;padding:10px 4px;text-align:center;border-radius:8px}
td input:focus{background:var(--fill)}
.sh-c{display:block;width:100%;border:0;border-radius:9px;padding:11px 4px;font:600 13.5px var(--sans);background:transparent;color:var(--mu);text-align:center}
.sh-c.w{background:var(--hv);color:var(--hvx)}
.sh-c.r{background:var(--fill);color:var(--mu)}
.sh-c.f{background:var(--warnbg);color:var(--warn)}
.sh-c.m{background:var(--badbg);color:var(--bad)}
h3.sub2{font:400 20px/1.1 var(--disp);margin:20px 0 2px;letter-spacing:.01em}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}
.wnav b{font-weight:700}
.gp{background:var(--panel);color:var(--panelx);border:1px solid var(--panelln);border-radius:20px;padding:20px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px 30px;align-items:end}
.gl{font:600 14px var(--sans);color:var(--panelmu);margin-bottom:6px}
.gbig{font:400 74px/.95 var(--disp);letter-spacing:.005em;font-variant-numeric:tabular-nums;color:var(--hv)}
.gbig.none{font:600 20px var(--sans);color:var(--panelmu)}
.trow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--panelln);font-size:15px}
.trow b{font-variant-numeric:tabular-nums}
.gnote{margin:0;color:var(--panelmu);font-size:14px}
.gp .g{background:var(--panelfill);color:var(--panelx);margin-top:12px}
#sheet:empty{display:none}
.shbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90vh;max-width:760px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.shh{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sbody{overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font:600 14.5px var(--sans);z-index:40;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mq{margin-bottom:2px;font-size:17px}
.fcs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.fcs::-webkit-scrollbar{display:none}
.fc{flex:none;border:0;border-radius:18px;padding:8px 14px;background:var(--fill);color:var(--ink);font:600 14px var(--sans)}
.fc.on{background:var(--ink);color:var(--bg)}
.pn.mr{padding:0;overflow:hidden}
.mrh{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;padding:14px 16px 8px}
.mrt{flex:1;min-width:0}
.mrt b{display:block;font-weight:700;font-size:16px}
.mrt small{display:block;color:var(--mu);font-size:13.5px;margin-top:2px}
.mrn{flex:none;color:var(--mu);font-size:13.5px;font-weight:600}
.zrow{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 14px}
.zc{border:0;min-width:46px;padding:9px 6px;border-radius:10px;font:700 14px var(--sans);font-variant-numeric:tabular-nums}
.zc.on{background:var(--go);color:var(--gotx)}
.zc.off{background:var(--bad);color:var(--gotx)}
.dlg.wd{width:min(94vw,520px)}
.dlg .fld{margin:0}
.dh2 h2{white-space:nowrap}
.dlg .dh2 .g{width:auto;flex:none}
.dh2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mrr{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--ln);background:transparent;color:var(--ink);font:inherit;text-align:left;padding:11px 2px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.stl{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:12px}
.stl.on{background:var(--gobg)}
.stl.off{background:var(--badbg)}
.stl b{flex:1;font:700 18px var(--sans)}
.stl .sq{width:38px;height:38px;font-size:20px}
.sn{min-width:24px;text-align:center;font:700 19px var(--sans);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbar{display:flex;gap:8px;margin:0 0 12px}
.lk{border:0;border-radius:10px;padding:10px 15px;font:700 14px var(--sans)}
.lk.on{background:var(--go);color:var(--gotx)}
.lk.off{background:var(--bad);color:var(--gotx)}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mcal .h{font:600 12.5px var(--sans);color:var(--mu);text-align:center;padding:2px 0 4px}
.mc2{min-height:62px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 1px 6px;font:700 15px var(--sans)}

function calcMonth(ym){
  const [y,mo]=ym.split("-").map(Number),n=new Date(y,mo,0).getDate();
  const b=S.bm[ym]||{},total=+b.total||0,W=(b.w&&b.w.length===7?b.w:DEFW).map(v=>+v||0),closed=b.closed||{};

// ---------- PDF
class Pg{constructor(){this.o=[]}
  txt(x,y,s,size,bold){this.o.push(`BT /${bold?"F2":"F1"} ${size||9} Tf ${x.toFixed(1)} ${y.toFixed(1)} Td (${pdfEnc(s)}) Tj ET`)}
  rt(xr,y,s,size,bold){const w=String(s).length*(size||9)*0.53;this.txt(xr-w,y,s,size,bold)}
  rect(x,y,w,h,g){this.o.push(`${g} g ${x} ${y} ${w} ${h} re f 0 g`)}
  line(x1,y1,x2,y2){this.o.push(`0.5 w 0.75 G ${x1} ${y1} m ${x2} ${y2} l S 0 G`)}
}
function pdfEnc(t){
  const map={"€":"\x80","–":"\x96","—":"\x97","’":"\x92","‘":"\x91","“":"\x93","”":"\x94","•":"\x95","…":"\x85","−":"-"};
  let o="";for(const ch of String(t)){const c=ch.charCodeAt(0);o+=map[ch]!==undefined?map[ch]:(c<256?ch:"?")}
  return o.replace(/[\\()]/g,m=>"\\"+m);
}
function buildPdf(pages){
  const objs=[],add=q=>{objs.push(q);return objs.length};
  add("<< /Type /Catalog /Pages 2 0 R >>");add("");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids=[];
  pages.forEach(pg=>{const c=pg.o.join("\n"),cid=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`),pid=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`);kids.push(pid+" 0 R")});
  objs[1]=`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`;
  let out="%PDF-1.4\n";const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
  const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
}
function pdfMonth(ym){

  const nf=new Intl.NumberFormat("it-IT",{maximumFractionDigits:0,useGrouping:"always"}),f=n=>nf.format(Math.round(n))+" €",sg=n=>(n>=0?"+":"-")+nf.format(Math.abs(Math.round(n)))+" €";
  const pages=[],P=()=>{const q=new Pg();pages.push(q);return q};
  let p=P();

  p.txt(40,782,"Generato il "+new Date().toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})+" alle "+hm(Date.now()),9);
  [["Budget mensile",f(total)],["Incassato",f(inc)],["Mancano",f(Math.max(0,total-inc))],["Raggiunto",(total?Math.round(inc/total*100):0)+"%"]].forEach(([k,v],i)=>{p.txt(40+i*130,752,k,8.5);p.txt(40+i*130,736,v,14,true)});
  const kr=kpiRows(ym),kl=kr[kr.length-1];

  if(kl){[["Conversion rate",pc1(kl.ccv)],["Scontrino medio",kl.csm==null?"-":eur2(kl.csm)],["Scontrini",nm2(kl.C.rc)],["Ingressi",nm2(kl.C.en)],["Incassi giorni chiusi",f(kl.C.inc)]].forEach(([k,v],i)=>{p.txt(40+i*103,696,k,8);p.txt(40+i*103,681,v,12,true)})}
  else p.txt(40,696,"Nessun giorno chiuso: KPI non disponibili.",8.5);
  let yy=650;
  p.rect(40,yy-5,515,16,0.9);
  [["Giorno",40,0],["Iniziale",140,1],["Aggiornato",205,1],["In turno",215,0],["A testa",400,1],["Incassato",470,1],["Scarto",545,1]].forEach(([t,x,r])=>r?p.rt(x,yy,t,8,true):p.txt(x,yy,t,8,true));
  yy-=17;
  rows.forEach((r,i)=>{
    if(i%2)p.rect(40,yy-5,515,16,0.96);
    const d=parse(r.x),names=r.on.map(q=>q.n).join(", "),show=!r.closed&&r.act>0;
    p.txt(42,yy,GG[wdi(r.x)]+" "+d.getDate()+(r.closed?" (chiuso)":""),8.5);
    if(!r.closed){p.rt(140,yy,f(r.base),8.5);p.rt(205,yy,f(r.target),8.5);p.txt(215,yy,names.length>30?names.slice(0,29)+"…":names||"-",8.5);p.rt(400,yy,r.per?f(r.per):"-",8.5);p.rt(470,yy,r.act?f(r.act):"-",8.5);if(show)p.rt(545,yy,sg(r.act-r.target),8.5)}
    yy-=17;
  });
  p.line(40,yy+12,555,yy+12);
  p.txt(42,yy-2,"Totale",8.5,true);p.rt(140,yy-2,f(total),8.5,true);p.rt(470,yy-2,f(inc),8.5,true);
  p=P();
  p.txt(40,800,"Incassato per persona",16,true);
  let y2=770;p.rect(40,y2-5,515,16,0.9);
  [["Persona",40,0],["Giorni in turno",330,1],["Incassato",440,1],["Media a giorno",545,1]].forEach(([t,x,r])=>r?p.rt(x,y2,t,8,true):p.txt(x,y2,t,8,true));
  y2-=17;
  eff().staff.forEach(q=>{
    const dd=rows.filter(r=>r.on.some(o=>o.id===q.id)).length,tot=rows.reduce((a,r)=>a+((+((S.rev[r.x]||{}).u||{})[q.id])||0),0);
    p.txt(42,y2,q.n,9);p.rt(330,y2,String(dd),9);p.rt(440,y2,f(tot),9);p.rt(545,y2,dd?f(tot/dd):"-",9);y2-=17;
  });
  const alt=rows.reduce((a,r)=>a+(+((S.rev[r.x]||{}).other)||0),0);
  if(alt){p.txt(42,y2,"Altro (aggiustamenti)",9);p.rt(440,y2,f(alt),9)}

}
async function exportPdf(ym,mode){
  const bytes=pdfMonth(ym),name="Budget-"+ym+".pdf",mo=+ym.slice(5),yr=ym.slice(0,4);
  const file=typeof File!=="undefined"?new File([bytes],name,{type:"application/pdf"}):null;
  const subj="Budget "+MONTHS[mo-1]+" "+yr;
  if(mode==="mail"&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:subj,text:subj});return}catch(e){if(e&&e.name==="AbortError")return}
  }
  const url=URL.createObjectURL(file||new Blob([bytes],{type:"application/pdf"})),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
  if(mode==="mail"){toast("PDF scaricato: allegalo alla mail");setTimeout(()=>{location.href="mailto:?subject="+encodeURIComponent(subj)},900)}
}

  else if(a==="askdel"){S.confirm=i;render()}
  else if(a==="delact"){S.confirm="";if(S.acts.length<=1)save(db.doc("days/"+S.day),{hasActs:false});db.doc("days/"+S.day+"/acts/"+i).delete().catch(()=>toast("Operazione non riuscita"));render()}
  else if(a==="savesum"){const v=(S.draft.sum!==undefined?S.draft.sum:(S.dayDoc.sum||"")).trim();delete S.draft.sum;const mp=memoPatch();save(db.doc("days/"+S.day),{sum:v,sumBy:S.uid,sumAt:Date.now(),...mp});S.dayDoc={...S.dayDoc,sum:v,sumBy:S.uid,sumAt:Date.now(),...mp};toast("Riepilogo salvato");render()}
  else if(a==="mclose"){clearDrafts();closeModal()}
  else if(a==="mprob"){const m=S.modal;if(!m||m.type!=="prob")return;const rs={};
    m.items.forEach(it=>{const r=(S.draft["pr_"+it.k+"_"+it.id]||"").trim();if(r&&!it.done)rs[it.k+"_"+it.id]=r});
    const note=(S.draft.prnote||"").trim(),o=m.kind==="open",at=Date.now();clearDrafts();closeModal();
    save(db.doc("days/"+S.day),o?{apRs:rs,apNote:note,apKO:{by:S.uid,at}}:{chRs:rs,chNote:note,chKO:{by:S.uid,at}});
    S.dayDoc={...S.dayDoc,[o?"apNote":"chNote"]:note,[o?"apKO":"chKO"]:{by:S.uid,at},[o?"apRs":"chRs"]:{...(S.dayDoc[o?"apRs":"chRs"]||{}),...rs}};
    if(!isAdmin())notify("admin",o?"Apertura KO ❌":"Chiusura KO ❌","Apri per vedere i dettagli",o?"?tab=ap":"?tab=ch");
    toast("Problema inviato");render()}
  else if(a==="menu"){if(S.modal&&S.modal.type==="menu")closeModal();else openModal({type:"menu"})}
  else if(a==="mopen"){closeModal();openModal({type:i})}
  else if(a==="ren"){const q=eff().staff.find(x=>x.id===i);if(!q)return;S.draft.rnname=q.n;S.draft.rnuid=q.uid||"";openModal({type:"rename",sid:i,from:D2.from||""})}
  else if(a==="mren"){const m=S.modal,v=(S.draft.rnname||"").trim(),sel=document.querySelector('#modal [data-d="rnuid"]'),lk=(sel&&typeof sel.value==="string")?sel.value:(S.draft.rnuid||"");clearDrafts();closeModal();if(m&&v){editCfg(c=>{const q=c.staff.find(x=>x.id===m.sid);if(q){q.n=v;if(lk)q.uid=lk;else delete q.uid}});toast(lk?v+" collegata a "+rn(lk):"Collegamento tolto")}if(m&&m.from==="coll")openModal({type:"colleghi"})}
  else if(a==="mcoll"){clearDrafts();closeModal();openModal({type:"colleghi"})}
  else if(a==="shiftset"){el.className="sp "+stateOf(el.value);save(db.doc("weeks/"+S.week),{cells:{[D2.c]:el.value}})}
  else if(a==="addreport"){const t=(S.draft.rp||"").trim();if(!t){toast("Scrivi la segnalazione");return}
    S.draft.rp="";
    db.doc("reports/"+uid8()).set({t,by:S.uid,at:Date.now(),res:false,day:S.day}).catch(()=>toast("Salvataggio non riuscito"));notify("all","Nuova segnalazione ⚠️",rn(S.uid)+": "+shT(t),"?tab=oggi");render()}
  else if(a==="resolve"){save(db.doc("reports/"+i),{res:true,resBy:S.uid,resAt:Date.now()});{const r=S.reports.find(x=>x.id===i);notify("all","Segnalazione risolta ✅",rn(S.uid)+(r?": "+shT(r.t):""),"?tab=oggi")}}
  else if(a==="delreport"){db.doc("reports/"+i).delete().catch(()=>toast("Operazione non riuscita"))}
  else if(a==="addtask"){if(!isAdmin())return;const t=(S.draft.tk||"").trim(),to=S.draft.tkto||"";if(!t){toast("Scrivi cosa deve fare");return}if(!to){toast("Scegli il collega");return}
    const dest=to==="__all"?Object.keys(S.names).filter(id=>id!==S.uid):[to];
    if(!dest.length){toast("Nessun collega a cui assegnare");return}
    const fd=S.draft.tkday||TODAY;S.draft.tk="";dest.forEach(id=>{db.doc("tasks/"+uid8()).set({t,to:id,by:S.uid,at:Date.now(),done:false,for:fd}).catch(()=>toast("Salvataggio non riuscito"));notify([id],"Nuova attività per te 📌",shT(t)+(fd!==TODAY?" (per il "+fd.split("-").reverse().join("/")+")":""),"?tab=oggi")});
    if(dest.length>1)toast("Assegnata a "+dest.length+" colleghi");render()}
  else if(a==="taskdone"){save(db.doc("tasks/"+i),{done:el.checked,doneAt:el.checked?Date.now():0,doneBy:el.checked?S.uid:""})}
  else if(a==="deltask"){db.doc("tasks/"+i).delete().catch(()=>toast("Operazione non riuscita"))}
  else if(a==="claimadmin"){db.doc("meta/admin").set({uid:S.uid}).then(()=>toast("Ora sei l’amministratore")).catch(()=>toast("Non riuscito: c’è già un amministratore"))}
  else if(a==="username"){const v=el.value.trim();if(v)save(db.doc("users/"+D2.u),{name:v})}
  else if(a==="avvisosave"){const cur=eff().avviso,v=(S.draft.avv!==undefined?S.draft.avv:(cur?cur.t:"")).trim();delete S.draft.avv;editCfg(c=>{c.avviso=v?{t:v,by:S.uid,at:Date.now()}:null});if(v&&v!==(cur?cur.t:""))notify("all","Avviso 📢",shT(v,140),"?tab=oggi");toast(v?"Avviso salvato":"Avviso tolto")}
  else if(a==="avvisoclear"){delete S.draft.avv;editCfg(c=>{c.avviso=null});toast("Avviso tolto")}
  else if(a==="savememo"){const mp=memoPatch();if(!Object.keys(mp).length){toast("Scrivi il promemoria");return}save(db.doc("days/"+S.day),mp);toast("Promemoria salvato")}
  else if(a==="memoread"){save(db.doc("days/"+i),{memoDone:{by:S.uid,at:Date.now()}})}
  else if(a==="itemname"){const v=el.value.trim();if(v)editCfg(c=>{c[k].find(x=>x.id===i).t=v})}
  else if(a==="delitem"){editCfg(c=>{c[k]=c[k].filter(x=>x.id!==i)})}
  else if(a==="additem"){const v=(S.draft["new_"+k]||"").trim();if(!v)return;S.draft["new_"+k]="";editCfg(c=>{c[k].push({id:uid8(),t:v})})}
  else if(a==="addrec"){const w=D2.w,v=(S.draft["newrec_"+w]||"").trim();if(!v)return;S.draft["newrec_"+w]="";editCfg(c=>{c.rec.push({id:uid8(),d:+w,t:v,w:S.draft["newrecw_"+w]||"oggi"})})}
  else if(a==="delrec"){editCfg(c=>{c.rec=c.rec.filter(x=>x.id!==i)})}
  else if(a==="recwhere"){const v=el.value;editCfg(c=>{const x=c.rec.find(x=>x.id===i);if(x)x.w=v})}
  else if(a==="recname"){const v=el.value.trim();if(v)editCfg(c=>{const x=c.rec.find(x=>x.id===i);if(x)x.t=v})}
  else if(a==="magcat"){S.mcat=i;render()}
  else if(a==="maggen"){S.mgen=i;render()}
  else if(a==="magopen"){S.magId=i;S.tab="mag";S.modal=null;renderModal();render();scrollTo(0,0)}
  else if(a==="magback"){S.magId="";render();scrollTo(0,0)}
  else if(a==="magsz"){const m=S.mag[i];if(!m)return;openModal({type:"magsz",src:i,z:D2.s,cat:"",gen:m.g||""})}
  else if(a==="zcat"||a==="zgen"){if(!S.modal)return;S.modal[a==="zcat"?"cat":"gen"]=i;S.modal.v=(S.modal.v||"")+"o";renderModal()}
  else if(a==="magq"){
    const m=S.mag[i];if(!m)return;const z=D2.s,n=Math.max(0,Math.min(99,magQ(m,z)+(+k))),at=Date.now();
    m.q={...(m.q||{}),[z]:n};m.at=at;m.by=S.uid;save(D.doc("mag/"+i),{q:{[z]:n},at,by:S.uid});render();
  }
  else if(a==="magcats"){openModal({type:"magcats"})}
  else if(a==="catname"){const v=el.value.trim();if(v)editCfg(c=>{c.cats=(c.cats||DEFCATS).map(x=>({...x}));const x=c.cats.find(y=>y.id===i);if(x)x.t=v});if(S.modal&&S.modal.type==="magcats"){S.modal.v=(S.modal.v||"")+"o";renderModal()}}
  else if(a==="catdel"){if(magAll().some(x=>catId(x.cat)===i)){toast("Ci sono prodotti in questa categoria");return}if(catArr().length<=1){toast("Serve almeno una categoria");return}editCfg(c=>{c.cats=(c.cats||DEFCATS).filter(y=>y.id!==i)});if(S.modal&&S.modal.type==="magcats"){S.modal.v=(S.modal.v||"")+"o";renderModal()}}
  else if(a==="catadd"){const v=(S.draft.newcat||"").trim();if(!v)return;S.draft.newcat="";editCfg(c=>{c.cats=(c.cats||DEFCATS).map(x=>({...x}));c.cats.push({id:"c"+uid8(),t:v})});if(S.modal&&S.modal.type==="magcats"){S.modal.v=(S.modal.v||"")+"o";renderModal()}}
  else if(a==="magnew"){magEditDrafts(null);openModal({type:"magedit",mid:""})}
  else if(a==="magedit"){const m=S.mag[i];if(!m)return;magEditDrafts(m);openModal({type:"magedit",mid:i})}
  else if(a==="magsave")magSave()
  else if(a==="magdelask"){openModal({type:"magdel",kind:"one",mid:i})}
  else if(a==="magdeldemo"){openModal({type:"magdel",kind:"demo"})}
  else if(a==="magdelgo"){
    const m=S.modal;if(!m)return;
    const ids=m.kind==="demo"?Object.keys(S.mag).filter(x=>S.mag[x].demo):[m.mid];
    ids.forEach(x=>{delete S.mag[x];D.doc("mag/"+x).delete().catch(()=>toast("Non riuscito"))});
    if(ids.includes(S.magId))S.magId="";
    toast(m.kind==="demo"?"Modelli di prova eliminati":"Modello eliminato");closeModal();render();
  }
  else if(a==="magdemo"){
    const at=Date.now();
    DEMO.forEach((d,j)=>{const id="d"+pad(j+1),doc={...d,demo:true,at,by:S.uid};S.mag[id]=doc;D.doc("mag/"+id).set(doc).catch(()=>toast("Salvataggio non riuscito"))});
    toast("Bozza caricata: "+DEMO.length+" modelli");render();
  }
}
const CH=["catname","chk","itemname","username","taskdone","recname","recwhere","bmtotal","bmw","rev","revx","shiftset"];
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))return;act(a,el)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(CH.includes(a))act(a,el)});
render();
</script>
</body>
</html>
